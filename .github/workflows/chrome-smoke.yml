name: Godot Chrome smoke

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_url:
        description: Optional deployed Pages URL to smoke-test after the local check
        required: false
        type: string

permissions:
  contents: read

jobs:
  export-and-smoke:
    runs-on: ubuntu-24.04
    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Chrome smoke dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download Godot and non-threaded web templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot-editor.zip"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            --output "$RUNNER_TEMP/export-templates.tpz"
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/export-templates.tpz" -d "$RUNNER_TEMP/template-files"
          find "$RUNNER_TEMP/template-files" -name 'web_nothreads_debug.zip' -exec cp {} "$RUNNER_TEMP/templates/" \;
          find "$RUNNER_TEMP/template-files" -name 'web_nothreads_release.zip' -exec cp {} "$RUNNER_TEMP/templates/" \;
          test -f "$RUNNER_TEMP/templates/web_nothreads_debug.zip"
          test -f "$RUNNER_TEMP/templates/web_nothreads_release.zip"

      - name: Export web build
        run: |
          GODOT_BIN=$(find "$RUNNER_TEMP/godot" -type f -name Godot -perm -111 | head -n 1)
          test -n "$GODOT_BIN"
          python3 export.py --godot "$GODOT_BIN" --templates "$RUNNER_TEMP/templates"

      - name: Serve exported build
        run: |
          python3 -m http.server 8774 --directory build --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/http.pid"
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8774/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8774/ >/dev/null

      - name: Run Chrome smoke check
        run: node browser-check.cjs

      - name: Run hosted Chrome smoke check
        if: ${{ inputs.hosted_url != '' }}
        env:
          VANIA_URL: ${{ inputs.hosted_url }}
        run: node browser-check.cjs
